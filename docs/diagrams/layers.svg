<svg xmlns="http://www.w3.org/2000/svg" width="960" height="624" viewBox="0 0 960 624" role="img" aria-label="Callido Restore: package layers and who calls whom">
<title>Callido Restore: package layers and who calls whom</title>
<style>
  .bg{fill:#ffffff} .t{fill:#1d1d1f;font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .s{fill:#6e6e73;font:11.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .m{fill:#1d1d1f;font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .h{fill:#1d1d1f;font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .band{fill:#f5f5f7;stroke:none}
  .box{fill:#ffffff;stroke:#c7c7cc;stroke-width:1.2}
  .acc{fill:#f3edff;stroke:#7c3aed;stroke-width:1.3}
  .ext{fill:#eef6ff;stroke:#2f6fd6;stroke-width:1.2}
  .ok{fill:#ecf8f0;stroke:#1f9d55;stroke-width:1.2}
  .warn{fill:#fff6e8;stroke:#c27c0e;stroke-width:1.2;stroke-dasharray:5 3}
  .a{stroke:#6e6e73;stroke-width:1.4;fill:none;marker-end:url(#arr)}
  .ad{stroke:#6e6e73;stroke-width:1.3;fill:none;stroke-dasharray:4 3;marker-end:url(#arr)}
  .ah{fill:#6e6e73}
  .n{fill:#7c3aed} .nt{fill:#ffffff;font:600 11px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1c1c1e} .t,.m,.h{fill:#f5f5f7} .s{fill:#a1a1a6}
    .band{fill:#2c2c2e} .box{fill:#1c1c1e;stroke:#48484a}
    .acc{fill:#2a2140;stroke:#a78bfa} .ext{fill:#15263d;stroke:#5b9bff} .ok{fill:#132a1d;stroke:#3fbf77}
    .warn{fill:#33270f;stroke:#e0a33a}
    .a,.ad{stroke:#a1a1a6} .ah{fill:#a1a1a6} .n{fill:#a78bfa} .nt{fill:#1c1c1e}
  }
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="960" height="624"/>
<text class="h" x="24" y="32" text-anchor="start">Package layers: a layer imports only the layers below it</text>
<text class="s" x="24" y="52" text-anchor="start">callido_restore/ · arrows: calls / imports · dashed: separate processes</text>
<rect class="band" x="16" y="70" width="928" height="70" rx="10"/>
<text class="s" x="30" y="92" text-anchor="start">UI</text>
<rect class="band" x="16" y="150" width="928" height="70" rx="10"/>
<text class="s" x="30" y="172" text-anchor="start">app</text>
<rect class="band" x="16" y="230" width="928" height="70" rx="10"/>
<text class="s" x="30" y="252" text-anchor="start">server</text>
<rect class="band" x="16" y="310" width="928" height="80" rx="10"/>
<text class="s" x="30" y="332" text-anchor="start">restore</text>
<rect class="band" x="16" y="400" width="928" height="120" rx="10"/>
<text class="s" x="30" y="422" text-anchor="start">domain</text>
<rect class="band" x="16" y="530" width="928" height="82" rx="10"/>
<text class="s" x="30" y="552" text-anchor="start">base</text>
<rect class="box" x="110" y="80" width="330" height="50" rx="8"/>
<text class="m" x="122" y="101" text-anchor="start">static/index.html</text>
<text class="s" x="122" y="120" text-anchor="start">single page, no build step, polls /api/job</text>
<rect class="ext" x="520" y="80" width="400" height="50" rx="8"/>
<text class="h" x="532" y="101" text-anchor="start">pywebview window (or the browser)</text>
<text class="s" x="532" y="120" text-anchor="start">WebKit on macOS, Edge WebView2 on Windows</text>
<rect class="box" x="110" y="160" width="330" height="50" rx="8"/>
<text class="m" x="122" y="181" text-anchor="start">app/main.py</text>
<text class="s" x="122" y="200" text-anchor="start">CLI, app.log, window; child dispatch</text>
<rect class="warn" x="520" y="160" width="400" height="50" rx="8"/>
<text class="h" x="532" y="181" text-anchor="start">child processes (same app binary)</text>
<text class="s" x="532" y="200" text-anchor="start">--mapper and --scan-worker ×4: run pool/ and core/</text>
<rect class="acc" x="110" y="240" width="810" height="50" rx="8"/>
<text class="m" x="122" y="261" text-anchor="start">server/api.py</text>
<text class="s" x="122" y="280" text-anchor="start">JSON API + static UI on 127.0.0.1 · auto-start of the preparation (POOL_LOCK) · jobs</text>
<rect class="box" x="110" y="320" width="400" height="60" rx="8"/>
<text class="m" x="122" y="341" text-anchor="start">restore/backup.py</text>
<text class="s" x="122" y="360" text-anchor="start">Backup: shares, runs, snapshot index (SQLite),</text>
<text class="s" x="122" y="376" text-anchor="start">queries, build_pool, restore (prefetch, resume)</text>
<rect class="box" x="530" y="320" width="220" height="60" rx="8"/>
<text class="m" x="542" y="341" text-anchor="start">restore/destination.py</text>
<text class="s" x="542" y="360" text-anchor="start">never overwrite or delete</text>
<text class="s" x="542" y="376" text-anchor="start">place_file, list_destination</text>
<rect class="box" x="770" y="320" width="150" height="60" rx="8"/>
<text class="m" x="782" y="341" text-anchor="start">restore/jobs.py</text>
<text class="s" x="782" y="360" text-anchor="start">start_job, JOBS</text>
<rect class="box" x="110" y="410" width="250" height="100" rx="8"/>
<text class="m" x="122" y="431" text-anchor="start">core/</text>
<text class="s" x="122" y="450" text-anchor="start">pool.py: PoolReader,</text>
<text class="s" x="122" y="466" text-anchor="start">ChunkIndex (Pool/chunk_index),</text>
<text class="s" x="122" y="482" text-anchor="start">chunk records, buckets, LZ4</text>
<text class="s" x="122" y="498" text-anchor="start">hbkmeta.py: revisions, flags</text>
<rect class="box" x="380" y="410" width="250" height="100" rx="8"/>
<text class="m" x="392" y="431" text-anchor="start">pool/</text>
<text class="s" x="392" y="450" text-anchor="start">the inferred map (no chunk</text>
<text class="s" x="392" y="466" text-anchor="start">table): anchor.py scan,</text>
<text class="s" x="392" y="482" text-anchor="start">place.py placer v3,</text>
<text class="s" x="392" y="498" text-anchor="start">indexfetch.py, poolmap*.py</text>
<rect class="box" x="650" y="410" width="270" height="100" rx="8"/>
<text class="m" x="662" y="431" text-anchor="start">sources/</text>
<text class="s" x="662" y="450" text-anchor="start">source.py: Source, ensure (cache)</text>
<text class="s" x="662" y="466" text-anchor="start">rclone.py: daemon, ls, copyfile</text>
<text class="s" x="662" y="482" text-anchor="start">transfer.py: every transfer number</text>
<text class="s" x="662" y="498" text-anchor="start">google.py: key checks</text>
<rect class="box" x="110" y="540" width="360" height="62" rx="8"/>
<text class="m" x="122" y="561" text-anchor="start">paths.py · about.py · oscompat.py</text>
<text class="s" x="122" y="580" text-anchor="start">settings folder, bundled rclone, version,</text>
<text class="s" x="122" y="596" text-anchor="start">Windows/macOS process differences</text>
<rect class="ext" x="520" y="540" width="400" height="62" rx="8"/>
<text class="h" x="532" y="561" text-anchor="start">rclone rcd (one daemon per app)</text>
<text class="s" x="532" y="580" text-anchor="start">127.0.0.1, random port and credentials;</text>
<text class="s" x="532" y="596" text-anchor="start">Google Drive · SMB · any rclone remote</text>
<path class="a" d="M275,130 L275,160"/>
<path class="a" d="M440,105 L520,105"/>
<text class="s" x="480.0" y="99" text-anchor="middle">shows</text>
<path class="a" d="M275,210 L275,240"/>
<path class="ad" d="M440,185 L520,185"/>
<text class="s" x="480.0" y="179" text-anchor="middle">starts</text>
<path class="a" d="M275,290 L275,320"/>
<path class="a" d="M640,290 L640,320"/>
<path class="a" d="M845,290 L845,320"/>
<path class="a" d="M200,380 L200,410"/>
<path class="a" d="M430,380 L470,410"/>
<path class="a" d="M480,380 L700,410"/>
<path class="a" d="M640,380 L760,410"/>
<path class="a" d="M360,460 L380,460"/>
<path class="a" d="M630,500 L650,500"/>
<path class="a" d="M240,510 L240,540"/>
<path class="a" d="M785,510 L785,540"/>
<text class="s" x="795" y="528" text-anchor="start">HTTP rc API</text>
</svg>
