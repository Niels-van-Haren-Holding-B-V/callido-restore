<svg xmlns="http://www.w3.org/2000/svg" width="980" height="592" viewBox="0 0 980 592" role="img" aria-label="Callido Restore: how a restore moves data">
<title>Callido Restore: how a restore moves data</title>
<style>
  .bg{fill:#ffffff} .t{fill:#1d1d1f;font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .s{fill:#6e6e73;font:11.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .m{fill:#1d1d1f;font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .h{fill:#1d1d1f;font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .band{fill:#f5f5f7;stroke:none}
  .box{fill:#ffffff;stroke:#c7c7cc;stroke-width:1.2}
  .acc{fill:#f3edff;stroke:#7c3aed;stroke-width:1.3}
  .ext{fill:#eef6ff;stroke:#2f6fd6;stroke-width:1.2}
  .ok{fill:#ecf8f0;stroke:#1f9d55;stroke-width:1.2}
  .warn{fill:#fff6e8;stroke:#c27c0e;stroke-width:1.2;stroke-dasharray:5 3}
  .a{stroke:#6e6e73;stroke-width:1.4;fill:none;marker-end:url(#arr)}
  .ad{stroke:#6e6e73;stroke-width:1.3;fill:none;stroke-dasharray:4 3;marker-end:url(#arr)}
  .ah{fill:#6e6e73}
  .n{fill:#7c3aed} .nt{fill:#ffffff;font:600 11px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1c1c1e} .t,.m,.h{fill:#f5f5f7} .s{fill:#a1a1a6}
    .band{fill:#2c2c2e} .box{fill:#1c1c1e;stroke:#48484a}
    .acc{fill:#2a2140;stroke:#a78bfa} .ext{fill:#15263d;stroke:#5b9bff} .ok{fill:#132a1d;stroke:#3fbf77}
    .warn{fill:#33270f;stroke:#e0a33a}
    .a,.ad{stroke:#a1a1a6} .ah{fill:#a1a1a6} .n{fill:#a78bfa} .nt{fill:#1c1c1e}
  }
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="980" height="592"/>
<text class="h" x="24" y="32" text-anchor="start">How a restore moves data</text>
<text class="s" x="24" y="52" text-anchor="start">read once, verify every chunk, never overwrite: from the backup on Drive (or a NAS, or a disk) to the target</text>
<rect class="ext" x="24" y="80" width="200" height="74" rx="8"/>
<text class="h" x="36" y="101" text-anchor="start">the backup (.hbk)</text>
<text class="s" x="36" y="120" text-anchor="start">Google Drive · NAS over SMB ·</text>
<text class="s" x="36" y="136" text-anchor="start">a local or mounted disk</text>
<rect class="ext" x="304" y="80" width="240" height="74" rx="8"/>
<text class="h" x="316" y="101" text-anchor="start">rclone daemon</text>
<text class="s" x="316" y="120" text-anchor="start">one backend per connection,</text>
<text class="s" x="316" y="136" text-anchor="start">throttled, retried (transfer.py)</text>
<rect class="box" x="624" y="80" width="332" height="74" rx="8"/>
<text class="h" x="636" y="101" text-anchor="start">app cache  ~/.hbk-explorer/cache</text>
<text class="s" x="636" y="120" text-anchor="start">slices and bucket files on demand;</text>
<text class="s" x="636" y="136" text-anchor="start">LRU ≤ 20 GB, several buckets at once</text>
<path class="a" d="M224,117 L304,117"/>
<text class="s" x="264.0" y="108" text-anchor="middle">read only</text>
<path class="a" d="M544,117 L624,117"/>
<text class="s" x="584.0" y="108" text-anchor="middle">copyfile</text>
<text class="h" x="24" y="196" text-anchor="start">PoolReader: where are the pieces of this file?</text>
<rect class="box" x="24" y="210" width="176" height="92" rx="8"/>
<text class="m" x="36" y="231" text-anchor="start">file row</text>
<text class="s" x="36" y="250" text-anchor="start">snapshot index:</text>
<text class="s" x="36" y="266" text-anchor="start">path, size, mtime,</text>
<text class="s" x="36" y="282" text-anchor="start">off_virtual_file</text>
<rect class="box" x="212" y="210" width="176" height="92" rx="8"/>
<text class="m" x="224" y="231" text-anchor="start">virtual_file</text>
<text class="s" x="224" y="250" text-anchor="start">56-byte entry:</text>
<text class="s" x="224" y="266" text-anchor="start">pointer A → the</text>
<text class="s" x="224" y="282" text-anchor="start">file&#x27;s chunk list</text>
<path class="a" d="M200,256 L212,256"/>
<rect class="box" x="400" y="210" width="176" height="92" rx="8"/>
<text class="m" x="412" y="231" text-anchor="start">file_chunk set</text>
<text class="s" x="412" y="250" text-anchor="start">record: chunk ids</text>
<text class="s" x="412" y="266" text-anchor="start">g = (ref − 64) / 29</text>
<path class="a" d="M388,256 L400,256"/>
<rect class="acc" x="588" y="210" width="176" height="92" rx="8"/>
<text class="m" x="600" y="231" text-anchor="start">Pool/chunk_index</text>
<text class="s" x="600" y="250" text-anchor="start">29-byte record per g:</text>
<text class="s" x="600" y="266" text-anchor="start">bucket id + entry</text>
<text class="s" x="600" y="282" text-anchor="start">(or: a copy → follow)</text>
<path class="a" d="M576,256 L588,256"/>
<rect class="box" x="776" y="210" width="176" height="92" rx="8"/>
<text class="m" x="788" y="231" text-anchor="start">bucket .index</text>
<text class="s" x="788" y="250" text-anchor="start">32-byte entry:</text>
<text class="s" x="788" y="266" text-anchor="start">clen, offset, ulen,</text>
<text class="s" x="788" y="282" text-anchor="start">md5 of the chunk</text>
<path class="a" d="M764,256 L776,256"/>
<rect class="warn" x="588" y="318" width="176" height="66" rx="8"/>
<text class="h" x="600" y="339" text-anchor="start">inferred map</text>
<text class="s" x="600" y="358" text-anchor="start">no chunk table: pool/,</text>
<text class="s" x="600" y="374" text-anchor="start">built once</text>
<path class="ad" d="M676,318 L676,304"/>
<text class="h" x="24" y="400" text-anchor="start">decode, verify and write</text>
<rect class="box" x="24" y="440" width="196" height="92" rx="8"/>
<text class="m" x="36" y="461" text-anchor="start">.bucket data</text>
<text class="s" x="36" y="480" text-anchor="start">LZ4 block at offset,</text>
<text class="s" x="36" y="496" text-anchor="start">decompressed to ulen</text>
<rect class="ok" x="250" y="440" width="196" height="92" rx="8"/>
<text class="h" x="262" y="461" text-anchor="start">md5 check</text>
<text class="s" x="262" y="480" text-anchor="start">every chunk against</text>
<text class="s" x="262" y="496" text-anchor="start">its index entry; file</text>
<text class="s" x="262" y="512" text-anchor="start">size against the row</text>
<rect class="box" x="476" y="440" width="196" height="92" rx="8"/>
<text class="h" x="488" y="461" text-anchor="start">staging folder</text>
<text class="s" x="488" y="480" text-anchor="start">per target root, same</text>
<text class="s" x="488" y="496" text-anchor="start">disk as the target;</text>
<text class="s" x="488" y="512" text-anchor="start">removed afterwards</text>
<rect class="ok" x="702" y="440" width="254" height="92" rx="8"/>
<text class="h" x="714" y="461" text-anchor="start">the target</text>
<text class="s" x="714" y="480" text-anchor="start">local: place_file (no overwrite)</text>
<text class="s" x="714" y="496" text-anchor="start">NAS: rclone moveto</text>
<text class="s" x="714" y="512" text-anchor="start">--ignore-existing</text>
<path class="a" d="M864,302 L864,410 L122,410 L122,440"/>
<path class="a" d="M220,486 L250,486"/>
<path class="a" d="M446,486 L476,486"/>
<path class="a" d="M672,486 L702,486"/>
<text class="s" x="24" y="560" text-anchor="start">Files already at the target are skipped; nothing there is ever overwritten or deleted. A stopped restore resumes at the next file.</text>
<text class="s" x="24" y="580" text-anchor="start">Small files (off_virtual_file &lt; 0) come whole from Pool/file_pool instead of buckets.</text>
</svg>
