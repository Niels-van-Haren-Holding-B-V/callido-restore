name: docker
# The NAS image (packaging/docker/Dockerfile): built for x86-64 and 64-bit ARM on every pull request and push to main, published
# to GitHub Container Registry only for a v* tag (ghcr.io/<owner>/callido-restore:<version> and :latest).
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image name and tags
        id: meta
        run: |
          img="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/callido-restore"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; echo "tags=$img:$v,$img:latest" >> "$GITHUB_OUTPUT"; echo "push=true" >> "$GITHUB_OUTPUT"
          else echo "tags=$img:dev" >> "$GITHUB_OUTPUT"; echo "push=false" >> "$GITHUB_OUTPUT"; fi
      - name: Smoke test (x86-64)
        run: |
          docker build -f packaging/docker/Dockerfile -t cr-smoke .
          docker run -d --name cr -p 8765:8765 -e CALLIDO_PASSWORD=ci-password-123 cr-smoke
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8765/ && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: nas:8765' http://127.0.0.1:8765/api/sources); test "$code" = 401
          curl -sf -H 'Host: nas:8765' -c jar -X POST -d '{"password":"ci-password-123"}' http://127.0.0.1:8765/api/login
          curl -sf -H 'Host: nas:8765' -b jar http://127.0.0.1:8765/api/about | tee about.json; grep -q '"rclone": "rclone v' about.json
          docker logs cr; docker rm -f cr
      - name: Log in to GitHub Container Registry
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Callido Restore for a NAS: restore files from a Synology Hyper Backup in the browser
            org.opencontainers.image.licenses=MIT
