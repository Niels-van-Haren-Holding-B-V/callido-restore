name: build-macos
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
  workflow_dispatch:

# Pull requests stay read-only. Only the publish job, on a v* tag, can write.
permissions:
  contents: read

jobs:
  # H18: the repo is public; fail on real names, local paths, private IPs or e-mail addresses in tracked files.
  # The denylist with the real names lives in the PRIVATE_DENYLIST repository secret (one extended regex per line).
  private-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./scripts/check_private.sh
        env:
          PRIVATE_DENYLIST: ${{ secrets.PRIVATE_DENYLIST }}

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: amd64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: ./build_app.sh
        env:
          RCLONE_ARCH: ${{ matrix.arch }}
      - run: ./scripts/smoke_macos_app.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CallidoRestore-${{ matrix.arch }}
          path: dist/CallidoRestore-*.dmg

  # Same steps a tag push uses to prepare the release, without publishing.
  # Pull requests and workflow_dispatch stop here. A v* tag continues to publish.
  assemble-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: CallidoRestore-*
          path: release
          merge-multiple: true
      - run: ./scripts/assemble_release.sh release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: |
            release/CallidoRestore-arm64.dmg
            release/CallidoRestore-amd64.dmg
            release/SHA256SUMS
      - name: Note whether this run publishes
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "Tag build: the publish job will create the GitHub Release." ;;
            *) echo "Dry run: release-bundle is uploaded. The publish job does not run." ;;
          esac

  publish:
    needs: assemble-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: release
      - run: ./scripts/assemble_release.sh release
      # Release signing (docs/HANDOVER.md): SHA256SUMS is signed with the Ed25519 key in the secret RELEASE_SIGNING_KEY; the app
      # installs an update only when this signature verifies under a key in about.UPDATE_PUBLIC_KEYS. Without the secret the
      # release is published unsigned and the app offers it only as a link to the release page.
      - name: Sign SHA256SUMS
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then echo "::warning::RELEASE_SIGNING_KEY is not set: SHA256SUMS is not signed"; exit 0; fi
          umask 077; printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-signing.pem"
          openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/release-signing.pem" -in release/SHA256SUMS -out release/SHA256SUMS.sig
          openssl pkey -in "$RUNNER_TEMP/release-signing.pem" -pubout > "$RUNNER_TEMP/pub.pem"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/pub.pem" -rawin -in release/SHA256SUMS -sigfile release/SHA256SUMS.sig
          echo "signed with public key $(openssl pkey -pubin -in "$RUNNER_TEMP/pub.pem" -outform DER | tail -c 32 | xxd -p -c 64)"
          rm -f "$RUNNER_TEMP/release-signing.pem"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Callido Restore ${{ github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            release/CallidoRestore-arm64.dmg
            release/CallidoRestore-amd64.dmg
            release/SHA256SUMS*
