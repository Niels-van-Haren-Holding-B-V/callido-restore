name: build-macos
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
  workflow_dispatch:

# Pull requests stay read-only. Only the publish job, on a v* tag, can write.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: amd64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: ./build_app.sh
        env:
          RCLONE_ARCH: ${{ matrix.arch }}
      - run: ./scripts/smoke_macos_app.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HyperBackupDesktop-${{ matrix.arch }}
          path: dist/HyperBackupDesktop-*.dmg

  # Same steps a tag push uses to prepare the release, without publishing.
  # Pull requests and workflow_dispatch stop here. A v* tag continues to publish.
  assemble-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: HyperBackupDesktop-*
          path: release
          merge-multiple: true
      - run: ./scripts/assemble_release.sh release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: |
            release/HyperBackupDesktop-arm64.dmg
            release/HyperBackupDesktop-amd64.dmg
            release/SHA256SUMS
      - name: Note whether this run publishes
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "Tag build: the publish job will create the GitHub Release." ;;
            *) echo "Dry run: release-bundle is uploaded. The publish job does not run." ;;
          esac

  publish:
    needs: assemble-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: release
      - run: ./scripts/assemble_release.sh release
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          fail_on_unmatched_files: true
          files: |
            release/HyperBackupDesktop-arm64.dmg
            release/HyperBackupDesktop-amd64.dmg
            release/SHA256SUMS
