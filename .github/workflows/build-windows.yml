name: build-windows
# Windows 10/11 x64 MSI (packaging/windows). Separate from build-macos on purpose: a Windows failure never blocks the DMG
# release. Every run uploads the MSI as a workflow artifact; on a v* tag the attach job adds it to the GitHub Release that
# build-macos's publish job creates (it waits for that release; it never creates or edits one itself).
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
    paths:                       # docs-only PRs do not wait on the Windows build; the unit tests run in tests.yml (windows leg)
      - 'callido_restore/**'
      - 'static/**'
      - 'assets/**'
      - 'packaging/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msi:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      WIX_VERSION: "5.0.2"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add -g "WixToolset.UI.wixext/$env:WIX_VERSION" "WixToolset.Util.wixext/$env:WIX_VERSION"
      - name: Python dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.0"
      - name: Build app and MSI
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\Git\usr\bin;$env:PATH"   # gpg for the rclone signature check
          python packaging/windows/build_msi.py
      - name: Smoke test (install, run, uninstall)
        run: python packaging/windows/smoke_windows.py --msi dist/CallidoRestore-x64.msi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CallidoRestore-windows-x64
          path: |
            dist/CallidoRestore-x64.msi
            dist/CallidoRestore-x64.msi.sha256

  # On a v* tag: add the MSI to the release. Only this job can write.
  attach:
    needs: msi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: CallidoRestore-windows-x64
          path: release
      - name: Wait for the release, then attach the MSI
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd release && sha256sum -c CallidoRestore-x64.msi.sha256)
          for i in $(seq 1 80); do
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" release/CallidoRestore-x64.msi release/CallidoRestore-x64.msi.sha256 -R "$GITHUB_REPOSITORY" --clobber
              exit 0
            fi
            echo "release $TAG not there yet (build-macos publishes it); waiting"; sleep 30
          done
          echo "release $TAG never appeared"; exit 1
